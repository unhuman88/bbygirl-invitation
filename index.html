<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Официальное приглашение 💌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Georgia, serif;
      color: white;
      overflow: hidden;

      background:
        linear-gradient(rgba(10, 18, 25, 0.55), rgba(5, 10, 15, 0.8)),
        url("https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=2000&q=85")
        center / cover no-repeat;
    }

    .card {
      width: 90%;
      max-width: 520px;
      padding: 40px 28px;
      text-align: center;
      background: rgba(20, 25, 28, 0.72);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    }

    .heart {
      font-size: 45px;
    }

    h1 {
      font-size: 28px;
      margin: 5px 0 25px;
      letter-spacing: 1px;
    }

    h2 {
      font-size: 25px;
      margin: 10px 0 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .date {
      margin: 25px 0;
      font-size: 18px;
      line-height: 2;
    }

    .question {
      margin-top: 30px;
      font-size: 21px;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 25px;
    }

    button {
      border: none;
      padding: 16px 25px;
      border-radius: 50px;
      font-size: 17px;
      cursor: pointer;
      transition: 0.25s;
      font-family: inherit;
    }

    .yes {
      background: #f3b6c9;
      color: #381d28;
    }

    .yes:hover {
      transform: scale(1.05);
    }

    .maybe {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .maybe:hover {
      transform: scale(1.03);
    }

    #answer {
      display: none;
      margin-top: 25px;
      font-size: 22px;
      line-height: 1.5;
    }

    .small {
      font-size: 14px;
      opacity: 0.65;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">💌</div>

    <h1>ОФИЦИАЛЬНОЕ ПРИГЛАШЕНИЕ</h1>

    <h2>Queen ❤️</h2>

    <p><b>Dear baby girl!</b></p>

    <p>Date with me?</p>

    <h2>✨ СВИДАНИЕ ✨</h2>

    <div class="date">
      📅 <b>Дата:</b> 20 September 2026<br>
      🕗 <b>Время:</b> 20:00<br>
      📍 <b>Место:</b> ??? 🤫
    </div>

    <div class="question">
      Вы принимаете приглашение?
    </div>

    <div class="buttons">
      <button class="yes" onclick="yesAnswer()">
        💗 ДА, КОНЕЧНО
      </button>

      <button class="maybe" onclick="maybeAnswer()">
        🙈 НУ Я ПОДУМАЮ
      </button>
    </div>

    <div id="answer"></div>

    <div class="small">
      *Место встречи будет раскрыто позже 🤫
    </div>

  </div>

  <script>
    function yesAnswer() {
      document.getElementById("answer").style.display = "block";
      document.getElementById("answer").innerHTML =
        "🥰 Отлично! Тогда свидание официально состоится! ❤️<br><br>До встречи 20 сентября 💌";

      document.querySelector(".buttons").style.display = "none";
    }

    function maybeAnswer() {
      document.getElementById("answer").style.display = "block";
      document.getElementById("answer").innerHTML =
        "🙈 Хорошо... но имей в виду — приглашение очень заманчивое 😏❤️";
    }
  </script>

</body>
</html>
