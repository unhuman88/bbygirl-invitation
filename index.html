<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For my Queen 💌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Georgia, serif;
      color: white;

      background:
        linear-gradient(rgba(10,18,25,.55), rgba(5,10,15,.82)),
        url("https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=2000&q=85")
        center / cover no-repeat;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 38px 28px;
      text-align: center;

      background: rgba(20,25,28,.72);
      backdrop-filter: blur(8px);

      border: 1px solid rgba(255,255,255,.2);
      border-radius: 24px;

      box-shadow: 0 20px 60px rgba(0,0,0,.55);
    }

    .heart {
      font-size: 42px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 29px;
      margin: 5px 0 28px;
    }

    .dear {
      font-size: 21px;
      margin-bottom: 10px;
    }

    .date-question {
      font-size: 23px;
      margin: 10px 0 28px;
    }

    .date {
      font-size: 18px;
      line-height: 2;
      margin-bottom: 28px;
    }

    .question {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 24px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    button {
      padding: 16px 20px;
      border-radius: 50px;
      border: none;
      font-family: Georgia, serif;
      font-size: 17px;
      cursor: pointer;
      transition: .25s;
    }

    button:hover {
      transform: scale(1.04);
    }

    .yes {
      background: #f3b6c9;
      color: #381d28;
    }

    .no {
      background: rgba(255,255,255,.14);
      color: white;
      border: 1px solid rgba(255,255,255,.3);
    }

    #answer {
      display: none;
      margin-top: 25px;
      font-size: 21px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">💌</div>

    <h1>For my Queen!</h1>

    <div class="dear">
      Dear baby girl!
    </div>

    <div class="date-question">
      Date with me?
    </div>

    <div class="date">
      📅 <b>Дата:</b> 20 September 2026<br>
      🕗 <b>Время:</b> 20:00<br>
      📍 <b>Место:</b> ??? 🤫
    </div>

    <div class="question">
      Вы принимаете приглашение?
    </div>

    <div class="buttons">
      <button class="yes" onclick="yesAnswer()">
        💗 ДА, МАЛЫШ
      </button>

      <button class="no" onclick="noAnswer()">
        🙈 НЕТ, СПОКОЙНОЙ НОЧИ
      </button>
    </div>

    <div id="answer"></div>

  </div>

  <script>
    function yesAnswer() {
      const answer = document.getElementById("answer");

      answer.style.display = "block";
      answer.innerHTML =
        "💗 Тогда всё решено... жду тебя 20 сентября ❤️";

      document.querySelector(".buttons").style.display = "none";
    }

    function noAnswer() {
      const answer = document.getElementById("answer");

      answer.style.display = "block";
      answer.innerHTML =
        "🌙 Спокойной ночи, Queen...";

      document.querySelector(".buttons").style.display = "none";
    }
  </script>

</body>
</html>
